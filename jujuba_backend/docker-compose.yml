version: '3.7'
services:
  db:
    image: mysql:8.0
    container_name: jujuba_bd
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: jujuba_brecho
    ports:
      - "3307:3306"
    networks:
      - app-network
  
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jujuba_backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/jujuba_brecho
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      - db
    ports:
      - "8080:8080"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
