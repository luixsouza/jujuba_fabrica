spring.application.name=jujuba

# Configurações do banco de dados
spring.datasource.url=jdbc:mysql://localhost:3306/jujuba_brecho
spring.datasource.username=luis
spring.datasource.password=220302

# Habilitar upload de arquivos
spring.servlet.multipart.enabled=true

# Definir tamanho máximo do arquivo (ajuste conforme sua necessidade)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Login Desenvolvimento
spring.security.user.name=luis
spring.security.user.password=220302

# Configurações do JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Porta do servidor
server.port=8080

#Springdoc OpenApi
springdoc.swagger-ui.path=/docs-jujuba.html
springdoc.api-docs.path=/docs-jujuba
springdoc.packages-to-scan=com.jujuba.controller

# Formatacao de datas e serializacao
spring.jackson.date-format=dd/MM/yyyy
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false