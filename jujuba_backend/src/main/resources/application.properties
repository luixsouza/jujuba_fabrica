spring.application.name=jujuba

# Configurações do banco de dados
spring.datasource.url=jdbc:mysql://localhost:3306/jujuba_brecho?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# Habilitar upload de arquivos
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Login Desenvolvimento
spring.security.user.name=luis
spring.security.user.password=220302

# Configurações do JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Porta do servidor
server.port=8080

# Springdoc OpenApi
springdoc.swagger-ui.path=/docs-jujuba.html
springdoc.api-docs.path=/docs-jujuba
springdoc.packages-to-scan=com.jujuba.controller

# Formatação de datas e serialização
spring.jackson.date-format=dd/MM/yyyy
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
