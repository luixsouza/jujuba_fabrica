spring.application.name=jujuba

# Configuracoes do banco de dados (usar variaveis de ambiente em producao)
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/jujuba_brecho?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:220302}

# Habilitar upload de arquivos
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Configuracoes do JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Porta do servidor
server.port=${SERVER_PORT:8080}

# JWT Configuration
jwt.secret=${JWT_SECRET:your-256-bit-secret-key-change-this-in-production-min-32-chars}
jwt.expiration.days=${JWT_EXPIRE_DAYS:0}
jwt.expiration.hours=${JWT_EXPIRE_HOURS:2}
jwt.expiration.minutes=${JWT_EXPIRE_MINUTES:0}

# CORS Configuration
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Springdoc OpenApi (desabilitar em producao com SWAGGER_ENABLED=false)
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/docs-jujuba.html
springdoc.api-docs.path=/docs-jujuba
springdoc.packages-to-scan=com.jujuba.controller

# Formatacao de datas e serializacao
spring.jackson.date-format=dd/MM/yyyy
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

# Actuator (health checks para Docker)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
